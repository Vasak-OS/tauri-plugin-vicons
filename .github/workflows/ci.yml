# Los chequeos viven en el repositorio `.github` de la organización, así que
# acá sólo se los llama. Cambiarlos es cambiarlos en un solo lugar.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  app:
    # Sólo lectura. Estos chequeos clonan, instalan dependencias y comprueban:
    # no comentan, no etiquetan, no publican.
    #
    # El workflow llamado declara lo mismo en su trabajo, que es donde el
    # permiso se aplica; esto lo escribe también acá porque el análisis
    # estático de este repositorio no puede ver el otro archivo, y ahí un
    # trabajo sin `permissions` se lee como permisos por omisión.
    permissions:
      contents: read
    uses: Vasak-OS/.github/.github/workflows/app.yml@main

  # La publicación, también compartida. Va después de los chequeos y sólo en
  # `main`: publicar algo que no pasó las comprobaciones es peor que no
  # publicar, y de crates.io no se puede borrar una versión, sólo retirarla.
  #
  # No hace falta acordarse de nada: el flujo mira si la versión del manifiesto
  # está en el registro y sube sólo si falta. Un push que no toca la versión no
  # hace nada.
  publicar:
    needs: app
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
    uses: Vasak-OS/.github/.github/workflows/publicar-plugin.yml@main
    secrets: inherit
