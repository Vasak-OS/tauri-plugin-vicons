[package]
name = "tauri-plugin-vicons"
version = "2.2.2"
authors = ["Joaquin (Pato) Decima <jdecima@vasak.net.ar>", "Vasak Group"]
description = "Icon API for Tauri plugins (Created for VasakOS)"
edition = "2021"
rust-version = "1.80.0"
exclude = ["/examples", "/dist-js", "/guest-js", "/node_modules"]
links = "tauri-plugin-vicons"
repository = "https://github.com/Vasak-OS/tauri-plugin-vicons/"
license-file = "LICENSE"
readme = "README.md"

[dependencies]
# Los directorios base del estándar, para que la regla de que una ruta relativa
# se ignora no sea otra copia a mano. Ver `paths::raices_de`.
dirs = "6"
tauri = "2"
serde = "1.0"
thiserror = "2"
gtk = "0.18"
base64 = "0.22"
glib = "0.18"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
